<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QuietPaws</title>

    <link rel="stylesheet" href="./css/style.css">
</head>

<body>

    <main id="app">

        <!-- Login view -->
        <section class="auth-page">

            <div class="auth-card">

                <div class="brand">
                    <div class="brand-icon">🐾</div>
                    <h1>QuietPaws</h1>
                    <p>Take a quiet pause.</p>
                </div>

                <div class="auth-heading">
                    <h2 id="auth-title">Welcome back</h2>
                    <p id="auth-subtitle">Come back to your quiet little space.</p>
                </div>

                <form id="auth-form">

                    <div class="input-group">
                        <label for="email">Email</label>

                        <input type="email" id="email" placeholder="you@example.com" required>
                    </div>

                    <div class="input-group">
                        <label for="password">Password</label>

                        <div class="password-wrapper">

                            <input type="password" id="password" placeholder="Enter your password" required>

                            <button type="button" id="toggle-password">
                                Show
                            </button>

                        </div>
                    </div>

                    <div class="input-group confirm-password-group hidden">
                        <label for="confirm-password">Confirm password</label>

                        <input type="password" id="confirm-password" placeholder="Confirm your password">
                    </div>

                    <button type="submit" class="primary-button" id="auth-button">
                        Log in
                    </button>

                </form>

                <p class="auth-switch">
                    <span id="switch-text">Don't have an account?</span>

                    <button type="button" id="switch-auth">
                        Create one
                    </button>
                </p>

            </div>

            <div class="auth-decoration">
                <div class="cloud cloud-one"></div>
                <div class="cloud cloud-two"></div>

                <div class="cat-illustration">
                    🐈
                </div>

                <div class="star star-one">✦</div>
                <div class="star star-two">✦</div>
                <div class="star star-three">✦</div>
            </div>

        </section>

        <!-- Timer view -->
        <section class="timer-page hidden" id="timer-page">

            <header class="timer-header">
                <div>
                    <p class="eyebrow">A little space for you</p>
                    <h1>Quiet Pause</h1>
                </div>

                <div class="paw-badge">
                    🐾
                </div>
            </header>


            <!-- Duration selection -->
            <section class="timer-card">

                <h2>How long would you like to pause?</h2>

                <div class="duration-options">

                    <button class="duration-button" data-minutes="5">
                        5 min
                    </button>

                    <button class="duration-button active" data-minutes="10">
                        10 min
                    </button>

                    <button class="duration-button" data-minutes="15">
                        15 min
                    </button>

                    <button class="duration-button" data-minutes="20">
                        20 min
                    </button>

                </div>


                <!-- Custom duration -->

                <div class="custom-duration">

                    <label for="custom-minutes">
                        Or choose your own
                    </label>

                    <div class="custom-input">

                        <input type="number" id="custom-minutes" min="1" max="60" placeholder="Minutes">

                        <span>min</span>

                    </div>

                </div>


                <!-- Intention -->

                <div class="intention">

                    <label for="intention">
                        Set an intention
                        <span>(optional)</span>
                    </label>

                    <input type="text" id="intention" maxlength="100"
                        placeholder="e.g. let go of what I can't control...">

                </div>


                <button class="start-button" id="start-timer">
                    Begin quiet session
                </button>

            </section>


            <!-- Countdown -->

            <section class="countdown-card hidden" id="countdown-card">

                <p class="breathing-text" id="breathing-text">
                    Breathe in
                </p>

                <div class="breathing-circle" id="breathing-circle">

                    <div class="cat-circle">
                        🐈
                    </div>

                </div>

                <p class="countdown" id="countdown">
                    10:00
                </p>

                <p class="quiet-message" id="quiet-message">
                    You don't have to rush.
                </p>

                <div class="timer-actions">

                    <button class="pause-button" id="pause-timer">
                        Pause
                    </button>

                    <button class="end-button" id="end-timer">
                        End session
                    </button>

                </div>

            </section>
        </section>

    </main>

    <script src="./js/app.js"></script>
</body>

</html>
