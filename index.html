<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QuietPaws</title>

    <link rel="stylesheet" href="./css/style.css">
</head>

<body>

    <main id="app">

        <!-- Login view -->
        <section class="auth-page">

            <div class="auth-card">

                <div class="brand">
                    <div class="brand-icon">🐾</div>
                    <h1>QuietPaws</h1>
                    <p>Take a quiet pause.</p>
                </div>

                <div class="auth-heading">
                    <h2>Welcome back</h2>
                    <p>Come back to your quiet little space.</p>
                </div>

                <form id="login-form">

                    <div class="input-group">
                        <label for="email">Email</label>
                        <input
                            type="email"
                            id="email"
                            placeholder="you@example.com"
                            required
                        >
                    </div>

                    <div class="input-group">
                        <label for="password">Password</label>

                        <div class="password-wrapper">
                            <input
                                type="password"
                                id="password"
                                placeholder="Enter your password"
                                required
                            >

                            <button
                                type="button"
                                id="toggle-password"
                                aria-label="Show password"
                            >
                                Show
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="primary-button">
                        Log in
                    </button>

                </form>

                <p class="auth-switch">
                    Don't have an account?
                    <button type="button" id="show-signup">
                        Create one
                    </button>
                </p>

            </div>

            <div class="auth-decoration">
                <div class="cloud cloud-one"></div>
                <div class="cloud cloud-two"></div>

                <div class="cat-illustration">
                    🐈
                </div>

                <div class="star star-one">✦</div>
                <div class="star star-two">✦</div>
                <div class="star star-three">✦</div>
            </div>

        </section>

    </main>

    <script src="./js/app.js"></script>
</body>
</html>
